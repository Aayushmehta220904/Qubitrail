[project]
name = "qubitrail"
version = "4.1.0"
description = "Quantum circuit design, debugging, repair and verification studio"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

# Qubitrail uses a custom FastAPI module layout.
[tool.vercel]
entrypoint = "app:app"
